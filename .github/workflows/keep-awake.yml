# Render's free plan puts the live demo to sleep after 15 idle minutes, and the next visitor then
# waits about a minute for it to wake up. This visits the health page every 10 minutes so the demo
# stays awake. It only reads /api/health: no model calls, no cost. Render's free plan includes 750
# hours a month, enough for one service running all month.
name: Keep the live demo awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Visit the health page
        run: curl --fail --silent --show-error --max-time 120 --retry 2 https://asclepius-ai.onrender.com/api/health
